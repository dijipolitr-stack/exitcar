<!DOCTYPE html>
<html lang="tr">
<head>

<title>Çevrimdışı — ExitCar</title>

<style>

  p{color:#4B5563;line-height:1.6;margin-bottom:24px}
  .sub{font-size:.85rem;color:#9CA3AF;margin-top:16px}
  button{background:#F30006;color:#fff;border:0;border-radius:12px;padding:14px 28px;
