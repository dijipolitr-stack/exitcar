<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araç Arama Sonuçları | ExitCar</title>
<meta name="description" content="ExitCar araç kiralama arama sonuçları. En uygun fiyatlı kiralık araçları karşılaştırın.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/search.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="index.html" class="topbar-logo">🚗 ExitCar</a>
  <a href="index.html" class="topbar-back">← Ana Sayfaya Dön</a>
</div>

<!-- MINI SEARCH -->
<div class="mini-search">
  <div class="mini-field" id="ms-pickup">📍 <span id="ms-pickup-val">İstanbul</span></div>
  <div style="color:#9CA3AF;font-size:12px">→</div>
  <div class="mini-field">📅 <span id="ms-pdate">Yarın</span></div>
  <div class="mini-field">🕐 <span id="ms-ptime">10:00</span></div>
  <div style="color:#9CA3AF;font-size:12px">—</div>
  <div class="mini-field">📅 <span id="ms-rdate">7 Gün Sonra</span></div>
  <div class="mini-field">🕐 <span id="ms-rtime">10:00</span></div>
  <button class="btn-search-mini" onclick="window.location.reload()">🔍 Güncelle</button>
</div>

<!-- LAYOUT -->
<div class="search-layout">

  <!-- SIDEBAR FILTERS -->
  <aside class="sidebar">
    <div class="filter-card">
      <div class="filter-header">
        <h3>🎛️ Filtreler</h3>
        <span class="filter-clear" onclick="clearFilters()">Temizle</span>
      </div>
      <!-- Price -->
      <div class="filter-section">
        <h4>Günlük Fiyat (TL)</h4>
        <div class="price-range-wrap">
          <div class="price-labels">
            <span id="priceMin">0</span>
            <span id="priceMax">15.000</span>
          </div>
          <input type="range" id="priceRange" min="0" max="15000" value="15000" step="100" oninput="updatePrice(this)">
        </div>
      </div>
      <!-- Transmission -->
      <div class="filter-section">
        <h4>Vites</h4>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Otomatik</label><span class="filter-count">18</span></div>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Manuel</label><span class="filter-count">6</span></div>
      </div>
      <!-- Fuel -->
      <div class="filter-section">
        <h4>Yakıt</h4>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Benzin</label><span class="filter-count">10</span></div>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Dizel</label><span class="filter-count">8</span></div>
        <div class="filter-option"><label><input type="checkbox" onchange="applyFilters()"> Elektrikli</label><span class="filter-count">3</span></div>
        <div class="filter-option"><label><input type="checkbox" onchange="applyFilters()"> Hibrit</label><span class="filter-count">3</span></div>
      </div>
      <!-- Category -->
      <div class="filter-section">
        <h4>Araç Sınıfı</h4>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Ekonomi</label><span class="filter-count">5</span></div>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Kompakt</label><span class="filter-count">6</span></div>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> SUV</label><span class="filter-count">5</span></div>
        <div class="filter-option"><label><input type="checkbox" checked onchange="applyFilters()"> Van</label><span class="filter-count">3</span></div>
        <div class="filter-option"><label><input type="checkbox" onchange="applyFilters()"> Premium</label><span class="filter-count">5</span></div>
      </div>
      <!-- Insurance -->
      <div class="filter-section">
        <h4>Sigorta</h4>
        <div class="filter-option"><label><input type="checkbox" onchange="applyFilters()"> Her Şey Dahil</label><span class="filter-count">12</span></div>
        <div class="filter-option"><label><input type="checkbox" onchange="applyFilters()"> Mini Hasar Dahil</label><span class="filter-count">8</span></div>
      </div>
    </div>
  </aside>

  <!-- RESULTS -->
  <div class="results-area">
    <div class="results-header">
      <div class="results-count"><strong id="resultCount">24</strong> araç bulundu</div>
      <div class="sort-row">
        <label>Sırala:</label>
        <select class="sort-select" onchange="sortCars(this.value)">
          <option value="price_asc">En Ucuz</option>
          <option value="price_desc">En Pahalı</option>
          <option value="rating">En Yüksek Puan</option>
          <option value="recommended">Önerilen</option>
        </select>
      </div>
    </div>

    <div id="carList"></div>

    <div class="pagination">
      <div class="page-btn active">1</div>
      <div class="page-btn">2</div>
      <div class="page-btn">3</div>
      <div class="page-btn">›</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/search.js"></script>
</body>
</html>
